name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare website files
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target = Path('_site')
          target.mkdir()
          shutil.copytree('website', target / 'website')
          (target / 'index.html').write_text('<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=website/"><title>Perception, Not Reasoning</title></head><body><a href="website/">Open the project website</a></body></html>', encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
